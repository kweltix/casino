services:
  - type: web
    name: ai-agent
    runtime: docker
    branch: ai-agent-initial-version
    plan: free
    numInstances: 1
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: AI_TEXT_MODEL
        value: gpt-5-mini
      - key: AI_IMAGE_MODEL
        value: gpt-image-2.5-flare
